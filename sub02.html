    <script src="./custom.js"></script>
    <script>
        // swiper 슬라이드
        const swiper = new Swiper('.detailSwiper', {
            direction: 'vertical',
            slidesPerView: 1,
            mousewheel: {
                forceToAxis: true,
                sensitivity: 1,
                releaseOnEdges: true,
            },
            pagination: {
                el: '.swiper-pagination',
                type: 'progressbar',
            },
        });

        //내부 스크롤 중에는 스크롤 막기
        document.querySelectorAll('.img-sec').forEach((el) => {
            el.addEventListener('wheel', (e) => {
                const isAtTop = el.scrollTop === 0;
                const isAtBottom =
                el.scrollTop + el.clientHeight >= el.scrollHeight;

                if (
                (isAtTop && e.deltaY < 0) ||
                (isAtBottom && e.deltaY > 0)
                ) {
                return;
                }

                e.stopPropagation();
            });
        });
    </script>
